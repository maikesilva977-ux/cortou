name: Teste - Download YouTube

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL do vídeo do YouTube para teste'
        required: true
        type: string

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Validar URL
        run: |
          URL="${{ inputs.video_url }}"
          if [[ ! "$URL" =~ ^https://(www\.)?(youtube\.com|youtu\.be)/ ]]; then
            echo "❌ URL inválida. Precisa ser um link do youtube.com ou youtu.be"
            exit 1
          fi
          echo "✅ URL válida: $URL"

      - name: Instalar yt-dlp e ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Marcar início do cronômetro
        id: cronometro
        run: echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Baixar vídeo
        id: download
        run: |
          set +e
          URL="${{ inputs.video_url }}"
          yt-dlp -f "best[ext=mp4]/best" -o "video_original.%(ext)s" --no-playlist \
            --print "DURACAO=%(duration)s;FORMATO=%(ext)s;TAMANHO_APROX=%(filesize_approx)s" \
            "$URL" > yt_info.txt 2> yt_error.txt
          STATUS=$?

          if [ $STATUS -ne 0 ]; then
            echo "❌ Falha no download do yt-dlp:"
            cat yt_error.txt
            echo ""
            echo "--- Causa provável ---"
            if grep -qi "sign in" yt_error.txt; then
              echo "→ Bloqueio anti-bot do YouTube para IPs de datacenter (cenário mais comum em CI)."
            elif grep -qi "private" yt_error.txt; then
              echo "→ Vídeo privado."
            elif grep -qi "unavailable\|not available" yt_error.txt; then
              echo "→ Vídeo indisponível ou removido."
            elif grep -qi "unsupported url" yt_error.txt; then
              echo "→ URL não suportada pelo yt-dlp."
            else
              echo "→ Causa não identificada automaticamente, veja o log completo acima."
            fi
            exit 1
          fi

          echo "✅ Download concluído com sucesso"
          cat yt_info.txt

      - name: Inspecionar vídeo baixado (ffprobe)
        run: |
          FILE=$(ls video_original.* | head -n1)
          echo "Arquivo baixado: $FILE"
          ls -lh "$FILE"
          echo "--- Detalhes técnicos ---"
          ffprobe -v error -show_entries format=duration,size,format_name \
            -of default=noprint_wrappers=1 "$FILE"

      - name: Gerar recorte de teste em 9:16 (FFmpeg)
        run: |
          FILE=$(ls video_original.* | head -n1)
          ffmpeg -y -i "$FILE" -t 10 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
            -c:v libx264 -c:a aac output_teste.mp4
          echo "--- Resultado final ---"
          ls -lh output_teste.mp4

      - name: Calcular tempo total de processamento
        if: always()
        run: |
          INICIO=${{ steps.cronometro.outputs.inicio }}
          FIM=$(date +%s)
          echo "⏱️ Tempo total: $((FIM - INICIO)) segundos"

      - name: Resumo final
        if: success()
        run: |
          echo "✅ TESTE PASSOU: download, inspeção e processamento funcionaram."

      - name: Resumo final (falha)
        if: failure()
        run: |
          echo "❌ TESTE FALHOU: veja o passo 'Baixar vídeo' ou 'Gerar recorte de teste' acima para a causa."

      - name: Upload do resultado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teste-cortou-output
          path: |
            output_teste.mp4
            yt_info.txt
          retention-days: 1
